name: whoop-price-tracker
on:
  schedule:
    - cron: "5 * * * *"        # every hour at :05 (GitHub can delay runs a few minutes)
  workflow_dispatch: {}         # lets you run it by hand from the Actions tab
concurrency: tracker
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - run: python tracker.py
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
          ALERT_ON_RISE: ${{ vars.ALERT_ON_RISE }}
      - name: Save results
        run: |
          git config user.name "price-tracker"
          git config user.email "price-tracker@users.noreply.github.com"
          git add state.json history.csv docs/prices.json
          git diff --cached --quiet || (git commit -m "price update" && git push)
